
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Note ♡</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #e8efe5;
    color: #344638;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 680px;
    text-align: center;
}

.small-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #819482;
}

h1 {
    font-family: 'Fraunces', serif;
    font-size: 43px;
    margin: 10px 0;
}

.subtitle {
    color: #7c8b7d;
    font-size: 13px;
}

/* ENVELOPE */

.envelope-area {
    margin-top: 80px;
    display: flex;
    justify-content: center;
}

.envelope {
    position: relative;
    width: 350px;
    height: 230px;
    background: #cbd9c8;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 20px 40px #526c5730;
    transition: 0.3s;
}

.envelope:hover {
    transform: translateY(-5px);
}

.envelope-back {
    position: absolute;
    inset: 0;
    background: #d8e4d4;
}

.envelope-flap {
    position: absolute;
    width: 100%;
    height: 60%;
    top: 0;
    background: #c0d2bd;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: 0.7s;
    z-index: 4;
}

.envelope-front {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        145deg,
        transparent 49.5%,
        #b9cdb9 50%
    ) left bottom / 50% 100% no-repeat,
    linear-gradient(
        215deg,
        transparent 49.5%,
        #c3d5c1 50%
    ) right bottom / 50% 100% no-repeat;
}

.seal {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #f6f3e9;
    display: grid;
    place-items: center;
    font-size: 23px;
    z-index: 5;
    transition: 0.3s;
}

.envelope.open .envelope-flap {
    transform: rotateX(180deg);
}

.envelope.open .seal {
    opacity: 0;
}

.tap-text {
    position: absolute;
    bottom: -40px;
    width: 100%;
    font-size: 12px;
    color: #819181;
}

/* LETTER */

.letter {
    display: none;
    background: #fffdf7;
    padding: 40px;
    margin-top: 30px;
    text-align: left;
    border: 1px solid #eeeee5;
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.date {
    font-size: 11px;
    color: #8b998a;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.letter h2 {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    margin-top: 30px;
}

.story {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    line-height: 1.9;
    color: #596a5b;
    white-space: pre-wrap;
}

.signoff {
    font-family: 'Fraunces', serif;
    font-style: italic;
    text-align: right;
    margin-top: 30px;
    color: #7c907e;
}

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 30px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 30px;
    padding: 12px 18px;
    background: #6f8b73;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

button.secondary {
    background: #edf2e9;
    color: #637b66;
}

/* WRITING */

.write-area {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #f8faf5;
    border-radius: 12px;
}

label {
    display: block;
    text-align: left;
    font-size: 11px;
    margin: 15px 0 7px;
    color: #748775;
    font-weight: 600;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #dfe7dc;
    border-radius: 9px;
    background: #fffefa;
    font: inherit;
    color: #344638;
}

textarea {
    min-height: 180px;
    resize: vertical;
    line-height: 1.7;
    font-family: 'Fraunces', serif;
    font-size: 16px;
}

.history {
    margin-top: 20px;
    text-align: center;
}

.history button {
    background: none;
    color: #829182;
    text-decoration: underline;
    font-size: 11px;
}

.history-list {
    display: none;
    margin-top: 15px;
}

.history-item {
    background: #f8faf5;
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
    text-align: left;
}

.footer {
    margin-top: 30px;
    color: #94a092;
    font-size: 11px;
}

@media(max-width: 500px) {
    .envelope {
        width: 290px;
        height: 200px;
    }

    .letter {
        padding: 25px;
    }

    h1 {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="small-title">
        A little something, just for you
    </div>

    <h1>A Little Note ♡</h1>

    <div class="subtitle">
        little stories from my everyday life
    </div>

    <!-- ENVELOPE -->

    <div class="envelope-area" id="envelopeArea">

        <div class="envelope" id="envelope">

            <div class="envelope-back"></div>

            <div class="envelope-front"></div>

            <div class="envelope-flap"></div>

            <div class="seal">✿</div>

            <div class="tap-text">
                tap to open your letter
            </div>

        </div>

    </div>

    <!-- LETTER -->

    <div class="letter" id="letter">

        <div class="date" id="date"></div>

        <h2>Hey you,</h2>

        <div class="story" id="story">
        </div>

        <div class="signoff">
            take care, okay? ♡
        </div>

        <div class="buttons">

            <button class="secondary" onclick="closeLetter()">
                ← Close letter
            </button>

            <button onclick="toggleWrite()">
                Write today's story
            </button>

        </div>

        <!-- WRITING AREA -->

        <div class="write-area" id="writeArea">

            <label>DATE</label>
            <input type="date" id="entryDate">

            <label>WHAT HAPPENED TODAY?</label>

            <textarea
                id="entryText"
                placeholder="Tell your story here..."
            ></textarea>

            <div class="buttons">

                <button onclick="saveEntry()">
                    Save letter ✓
                </button>

            </div>

        </div>

        <div class="history">

            <button onclick="toggleHistory()">
                read an older letter
            </button>

            <div class="history-list" id="historyList">
            </div>

        </div>

    </div>

    <div class="footer">
        no big speeches. just little pieces of the day. 🌿
    </div>

</div>

<script>

let entries = JSON.parse(
    localStorage.getItem("myDiary") || "[]"
);

const today = () =>
    new Date().toISOString().slice(0, 10);

function formatDate(date) {

    return new Date(date + "T12:00:00")
        .toLocaleDateString("en-US", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

}

// OPEN ENVELOPE

document.getElementById("envelope")
.addEventListener("click", function() {

    this.classList.add("open");

    setTimeout(() => {

        document.getElementById("envelopeArea")
        .style.display = "none";

        document.getElementById("letter")
        .style.display = "block";

        let entry = entries.find(
            e => e.date === today()
        ) || entries[0];

        if (entry) {
            showEntry(entry);
        } else {
            document.getElementById("date")
            .innerText = formatDate(today());

            document.getElementById("story")
            .innerText = "Today is a blank page. Maybe you'd like to write the first little story?";

            document.getElementById("entryDate")
            .value = today();

            document.getElementById("writeArea")
            .style.display = "block";
        }

    }, 700);

});

// SHOW LETTER

function showEntry(entry) {

    document.getElementById("date")
    .innerText = formatDate(entry.date);

    document.getElementById("story")
    .innerText = entry.text;

    document.getElementById("entryDate")
    .value = entry.date;

    document.getElementById("entryText")
    .value = entry.text;

    document.getElementById("writeArea")
    .style.display = "none";

    renderHistory();

}

// CLOSE LETTER

function closeLetter() {

    document.getElementById("letter")
    .style.display = "none";

    document.getElementById("envelopeArea")
    .style.display = "flex";

    document.getElementById("envelope")
    .classList.remove("open");

}

// WRITE

function toggleWrite() {

    let area = document.getElementById("writeArea");

    area.style.display =
        area.style.display === "block"
        ? "none"
        : "block";

    document.getElementById("entryDate")
    .value = today();

}

// SAVE ENTRY

function saveEntry() {

    let date = document.getElementById("entryDate").value;
    let text = document.getElementById("entryText").value.trim();

    if (!text) {
        alert("Write something first 🙂");
        return;
    }

    let index = entries.findIndex(
        e => e.date === date
    );

    let newEntry = { date, text };

    if (index >= 0) {
        entries[index] = newEntry;
    } else {
        entries.push(newEntry);
    }

    entries.sort((a, b) => b.date.localeCompare(a.date));

    localStorage.setItem(
        "myDiary",
        JSON.stringify(entries)
    );

    showEntry(newEntry);

}

// HISTORY

function renderHistory() {

    let list = document.getElementById("historyList");

    list.innerHTML = "";

    entries.forEach(entry => {

        let item = document.createElement("div");

        item.className = "history-item";

        let heading = document.createElement("strong");
        heading.innerText = formatDate(entry.date);

        let preview = document.createElement("div");
        preview.innerText = entry.text.slice(0, 80) + "...";

        item.appendChild(heading);
        item.appendChild(preview);

        item.onclick = () => showEntry(entry);

        list.appendChild(item);

    });

}

function toggleHistory() {

    let list = document.getElementById("historyList");

    list.style.display =
        list.style.display === "block"
        ? "none"
        : "block";

}

</script>

</body>
</html>
