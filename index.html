<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Note ♡</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #e8efe5;
    color: #344638;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container { width: 100%; max-width: 680px; text-align: center; }

.small-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #819482;
}

h1 { font-family: 'Fraunces', serif; font-size: 43px; margin: 10px 0; }

.subtitle { color: #7c8b7d; font-size: 13px; }

/* ENVELOPE */
.envelope-area { margin-top: 80px; display: flex; justify-content: center; }

.envelope {
    position: relative;
    width: 350px;
    height: 230px;
    background: #cbd9c8;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 20px 40px #526c5730;
    transition: 0.3s;
}
.envelope:hover { transform: translateY(-5px); }

.envelope-back { position: absolute; inset: 0; background: #d8e4d4; }

.envelope-flap {
    position: absolute;
    width: 100%;
    height: 60%;
    top: 0;
    background: #c0d2bd;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: 0.7s;
    z-index: 4;
}

.envelope-front {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(145deg, transparent 49.5%, #b9cdb9 50%) left bottom / 50% 100% no-repeat,
        linear-gradient(215deg, transparent 49.5%, #c3d5c1 50%) right bottom / 50% 100% no-repeat;
}

.seal {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #f6f3e9;
    display: grid;
    place-items: center;
    font-size: 23px;
    z-index: 5;
    transition: 0.3s;
}

.envelope.open .envelope-flap { transform: rotateX(180deg); }
.envelope.open .seal { opacity: 0; }

.tap-text { position: absolute; bottom: -40px; width: 100%; font-size: 12px; color: #819181; }

/* NEW: quick write button on the envelope screen */
.quick-write { margin-top: 70px; }
.quick-write button { padding: 12px 22px; }

/* LETTER */
.letter {
    display: none;
    background: #fffdf7;
    padding: 40px;
    margin-top: 30px;
    text-align: left;
    border: 1px solid #eeeee5;
    animation: appear 0.7s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.date { font-size: 11px; color: #8b998a; letter-spacing: 1px; text-transform: uppercase; }

.letter h2 { font-family: 'Fraunces', serif; font-size: 30px; margin-top: 30px; }

.story {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    line-height: 1.9;
    color: #596a5b;
    white-space: pre-wrap;
}

.signoff { font-family: 'Fraunces', serif; font-style: italic; text-align: right; margin-top: 30px; color: #7c907e; }

.buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; flex-wrap: wrap; }

button {
    border: none;
    border-radius: 30px;
    padding: 12px 18px;
    background: #6f8b73;
    color: white;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
}
button.secondary { background: #edf2e9; color: #637b66; }

/* WRITING */
.write-area { display: none; margin-top: 25px; padding: 20px; background: #f8faf5; border-radius: 12px; }

label { display: block; text-align: left; font-size: 11px; margin: 15px 0 7px; color: #748775; font-weight: 600; }
label:first-child { margin-top: 0; }

input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #dfe7dc;
    border-radius: 9px;
    background: #fffefa;
    font: inherit;
    color: #344638;
}

textarea {
    min-height: 180px;
    resize: vertical;
    line-height: 1.7;
    font-family: 'Fraunces', serif;
    font-size: 16px;
}

.write-area .buttons { margin-top: 20px; align-items: center; }

button.danger { background: none; color: #b07a72; text-decoration: underline; font-size: 12px; padding: 8px; display: none; }

.history { margin-top: 20px; text-align: center; }
.history > button { background: none; color: #829182; text-decoration: underline; font-size: 11px; }
.history-list { display: none; margin-top: 15px; }

.history-item {
    background: #f8faf5;
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
    text-align: left;
}

.footer { margin-top: 30px; color: #94a092; font-size: 11px; }

@media(max-width: 500px) {
    .envelope { width: 290px; height: 200px; }
    .letter { padding: 25px; }
    h1 { font-size: 36px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="small-title">A little something, just for you</div>
    <h1>A Little Note ♡</h1>
    <div class="subtitle">little stories from my everyday life</div>

    <!-- FRONT SCREEN: envelope + quick write -->
    <div id="front">

        <div class="envelope-area">
            <div class="envelope" id="envelope">
                <div class="envelope-back"></div>
                <div class="envelope-front"></div>
                <div class="envelope-flap"></div>
                <div class="seal">✿</div>
                <div class="tap-text">tap to open your letter</div>
            </div>
        </div>

        <div class="quick-write">
            <button class="secondary" id="quickWriteBtn">✎ Write today's story</button>
        </div>

    </div>

    <!-- LETTER -->
    <div class="letter" id="letter">

        <div class="date" id="date"></div>

        <h2>Hey you,</h2>

        <div class="story" id="story"></div>

        <div class="signoff">take care, okay? ♡</div>

        <div class="buttons">
            <button class="secondary" onclick="closeLetter()">← Close letter</button>
            <button onclick="toggleWrite()">Write today's story</button>
        </div>

        <!-- WRITING AREA -->
        <div class="write-area" id="writeArea">

            <label>DATE</label>
            <input type="date" id="entryDate">

            <label>WHAT HAPPENED TODAY?</label>
            <textarea id="entryText" placeholder="Tell your story here..."></textarea>

            <div class="buttons">
                <button onclick="saveEntry()">Save letter ✓</button>
                <button class="danger" id="deleteBtn" onclick="deleteEntry()">delete this letter</button>
            </div>

        </div>

        <div class="history">
            <button onclick="toggleHistory()">read an older letter</button>
            <div class="history-list" id="historyList"></div>
        </div>

    </div>

    <div class="footer">no big speeches. just little pieces of the day. 🌿</div>

</div>

<script>

// ---------- STORAGE (safe, won't crash if storage is blocked) ----------
let warnedAboutStorage = false;

function loadEntries() {
    try {
        return JSON.parse(localStorage.getItem("myDiary") || "[]");
    } catch (e) {
        return [];
    }
}

function persist() {
    try {
        localStorage.setItem("myDiary", JSON.stringify(entries));
    } catch (e) {
        if (!warnedAboutStorage) {
            warnedAboutStorage = true;
            alert("This browser won't let me save your letters, so they'll disappear when you close the page.");
        }
    }
}

let entries = loadEntries();

// ---------- HELPERS ----------

// Uses YOUR local date (the old version used UTC, which can show yesterday in the morning)
function today() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function formatDate(date) {
    return new Date(date + "T12:00:00").toLocaleDateString("en-US", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
}

const $ = id => document.getElementById(id);

// ---------- OPEN / CLOSE ----------

function openEnvelope(writeMode) {
    $("envelope").classList.add("open");

    setTimeout(() => {
        $("front").style.display = "none";
        $("letter").style.display = "block";
        renderHistory();

        if (writeMode) {
            const entry = entries.find(e => e.date === today()) || entries[0];
            if (entry) showEntry(entry); else showBlank();
            startWriting(today());
            return;
        }

        const entry = entries.find(e => e.date === today()) || entries[0];
        if (entry) {
            showEntry(entry);
        } else {
            showBlank();
            startWriting(today());
        }
    }, 700);
}

$("envelope").addEventListener("click", () => openEnvelope(false));
$("quickWriteBtn").addEventListener("click", () => openEnvelope(true));

function closeLetter() {
    $("letter").style.display = "none";
    $("front").style.display = "block";
    $("envelope").classList.remove("open");
}

// ---------- SHOW ----------

function showBlank() {
    $("date").innerText = formatDate(today());
    $("story").innerText = "Today is a blank page. Maybe you'd like to write the first little story?";
}

function showEntry(entry) {
    $("date").innerText = formatDate(entry.date);
    $("story").innerText = entry.text;
    $("writeArea").style.display = "none";
    renderHistory();
}

// ---------- WRITE ----------

// Opens the writing box for a date, filled with that day's letter if one exists
function startWriting(date) {
    $("writeArea").style.display = "block";
    $("entryDate").value = date;
    loadDraft();
    $("entryText").focus();
}

// Fills the textarea with the saved letter for the chosen date (or empties it)
function loadDraft() {
    const date = $("entryDate").value;
    const existing = entries.find(e => e.date === date);
    $("entryText").value = existing ? existing.text : "";
    $("deleteBtn").style.display = existing ? "inline-block" : "none";
}

$("entryDate").addEventListener("change", loadDraft);

function toggleWrite() {
    const area = $("writeArea");
    if (area.style.display === "block") {
        area.style.display = "none";
    } else {
        startWriting(today());
    }
}

function saveEntry() {
    const date = $("entryDate").value;
    const text = $("entryText").value.trim();

    if (!date) {
        alert("Pick a date first 🙂");
        return;
    }
    if (!text) {
        alert("Write something first 🙂");
        return;
    }

    const newEntry = { date, text };
    const index = entries.findIndex(e => e.date === date);

    if (index >= 0) entries[index] = newEntry;
    else entries.push(newEntry);

    entries.sort((a, b) => b.date.localeCompare(a.date));
    persist();
    showEntry(newEntry);
}

function deleteEntry() {
    const date = $("entryDate").value;
    if (!confirm("Delete this letter? This can't be undone.")) return;

    entries = entries.filter(e => e.date !== date);
    persist();

    if (entries.length) {
        showEntry(entries[0]);
    } else {
        showBlank();
        renderHistory();
        startWriting(today());
    }
}

// ---------- HISTORY ----------

function renderHistory() {
    const list = $("historyList");
    list.innerHTML = "";

    entries.forEach(entry => {
        const item = document.createElement("div");
        item.className = "history-item";

        const heading = document.createElement("strong");
        heading.innerText = formatDate(entry.date);

        const preview = document.createElement("div");
        preview.innerText = entry.text.slice(0, 80) + (entry.text.length > 80 ? "..." : "");

        item.appendChild(heading);
        item.appendChild(preview);
        item.onclick = () => showEntry(entry);

        list.appendChild(item);
    });
}

function toggleHistory() {
    const list = $("historyList");
    list.style.display = list.style.display === "block" ? "none" : "block";
}

</script>

</body>
</html>
