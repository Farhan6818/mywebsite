<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Note ♡</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8efe5;--ink:#344638;--muted:#7c8b7d;--card:#fffdf7;--line:#eeeee5;--story:#596a5b;--soft:#f8faf5;--field:#fffefa;--fline:#dfe7dc;--btn:#6f8b73;--btn2:#edf2e9;--btn2t:#637b66;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b241e;--ink:#dfe9dc;--muted:#9fb09f;--card:#252f28;--line:#34443a;--story:#c5d3c3;--soft:#202a23;--field:#1b241e;--fline:#34443a;--btn2:#2f3d33;--btn2t:#b9ccb9}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b241e;--ink:#dfe9dc;--muted:#9fb09f;--card:#252f28;--line:#34443a;--story:#c5d3c3;--soft:#202a23;--field:#1b241e;--fline:#34443a;--btn2:#2f3d33;--btn2t:#b9ccb9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:680px;text-align:center}
.small-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Fraunces',Georgia,serif;font-size:43px;margin:10px 0}
.subtitle{color:var(--muted);font-size:13px}
.envelope-area{margin-top:70px;display:flex;justify-content:center}
.envelope{position:relative;width:350px;height:230px;background:#cbd9c8;cursor:pointer;border-radius:8px;box-shadow:0 20px 40px #526c5730;transition:.3s}
.envelope:hover{transform:translateY(-5px)}
.envelope-back{position:absolute;inset:0;background:#d8e4d4}
.envelope-flap{position:absolute;width:100%;height:60%;top:0;background:#c0d2bd;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:.7s;z-index:4}
.envelope-front{position:absolute;inset:0;background:linear-gradient(145deg,transparent 49.5%,#b9cdb9 50%) left bottom/50% 100% no-repeat,linear-gradient(215deg,transparent 49.5%,#c3d5c1 50%) right bottom/50% 100% no-repeat}
.seal{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:#f6f3e9;display:grid;place-items:center;font-size:23px;z-index:5;transition:.3s}
.envelope.open .envelope-flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
.tap-text{position:absolute;bottom:-40px;width:100%;font-size:12px;color:var(--muted)}
.quick{margin-top:70px}
.letter{display:none;background:var(--card);padding:36px;margin-top:30px;text-align:left;border:1px solid var(--line);animation:appear .7s ease}
@keyframes appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.date{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.letter h2{font-family:'Fraunces',Georgia,serif;font-size:28px;margin:24px 0 8px}
.note{background:var(--soft);border-radius:12px;padding:16px 18px;margin-top:14px}
.who{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.who a{color:var(--muted);cursor:pointer;text-decoration:underline;text-transform:none;letter-spacing:0;font-weight:500}
.story{font-family:'Fraunces',Georgia,serif;font-size:18px;line-height:1.9;color:var(--story);white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.empty{color:var(--muted);font-family:'Fraunces',Georgia,serif;font-size:17px;margin-top:14px}
.buttons{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
button{border:0;border-radius:30px;padding:12px 18px;background:var(--btn);color:#fff;cursor:pointer;font-weight:600;font-family:inherit}
button.secondary{background:var(--btn2);color:var(--btn2t)}
.write-area{display:none;margin-top:22px;padding:20px;background:var(--soft);border-radius:12px}
label{display:block;font-size:11px;margin:14px 0 7px;color:var(--muted);font-weight:600}
label:first-child{margin-top:0}
input,textarea{width:100%;padding:12px;border:1px solid var(--fline);border-radius:9px;background:var(--field);font:inherit;color:var(--ink)}
textarea{min-height:180px;resize:vertical;line-height:1.7;font-family:'Fraunces',Georgia,serif;font-size:16px}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:8px}
.item{background:var(--soft);padding:12px 14px;margin-top:8px;border-radius:10px;cursor:pointer;font-size:13px;text-align:left}
.item div{color:var(--muted);margin-top:3px}
.footer,.status{margin-top:26px;color:var(--muted);font-size:11px}
@media(max-width:500px){.envelope{width:290px;height:200px}.letter{padding:22px}h1{font-size:36px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
  <div class="small-title">A little something, just for us</div>
  <h1>A Little Note ♡</h1>
  <div class="subtitle">our little stories from everyday life</div>

  <!-- HOME: envelope + today's letters -->
  <div id="home">
    <div id="front">
      <div class="envelope-area">
        <div class="envelope" id="envelope">
          <div class="envelope-back"></div><div class="envelope-front"></div><div class="envelope-flap"></div>
          <div class="seal">✿</div><div class="tap-text">tap to open our letters</div>
        </div>
      </div>
      <div class="quick"><button class="secondary" id="quickBtn">✎ Write today’s story</button></div>
    </div>

    <div class="letter" id="letter">
      <div class="date" id="date"></div>
      <h2>hiiii,</h2>
      <div id="notes"></div>
      <div class="buttons">
        <button class="secondary" id="closeBtn">← Close</button>
        <button id="writeBtn">✎ Write my story</button>
      </div>
      <div class="write-area" id="writeArea">
        <label>YOUR NAME</label>
        <input id="myName" maxlength="30" placeholder="Who’s writing?">
        <label>DATE</label>
        <input type="date" id="entryDate">
        <label>WHAT HAPPENED TODAY?</label>
        <textarea id="entryText" placeholder="Tell your story here..."></textarea>
        <div class="buttons"><button id="saveBtn">Save letter ✓</button></div>
      </div>
      <div class="buttons" style="justify-content:center"><button class="link" id="archiveBtn">read older letters →</button></div>
    </div>
  </div>

  <!-- ARCHIVE: all old letters -->
  <div id="archive" style="display:none">
    <div class="letter" style="display:block">
      <div class="date">our old letters</div>
      <h2>Everything we’ve written</h2>
      <div id="archiveList"></div>
      <div class="buttons"><button class="secondary" id="backBtn">← Back</button></div>
    </div>
  </div>

  <div class="status" id="status">connecting…</div>
  <div class="footer">no big speeches. just little pieces of the day. 🌿</div>
</div>

<script>
/* ============ PASTE YOUR FIREBASE SETTINGS HERE ============ */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
/* ============================================================ */

const $ = id => document.getElementById(id);
let db = null, letters = [], shownDate = "", opened = false;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function slug(n) { return (n || "").trim().toLowerCase().replace(/[\/.\s]+/g, "-"); }
function today() { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
function fmt(d) { return new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const meKey = () => slug($("myName").value || store("diaryName") || "");
const mine = date => letters.find(l => l.date === date && l.author === meKey());

/* ---------- views ---------- */
function route() {
  const isArchive = location.hash === "#archive";
  $("home").style.display = isArchive ? "none" : "block";
  $("archive").style.display = isArchive ? "block" : "none";
  render();
}
window.addEventListener("hashchange", route);
$("archiveBtn").onclick = () => { location.hash = "archive"; };
$("backBtn").onclick = () => { location.hash = ""; };

function openEnvelope(write) {
  $("envelope").classList.add("open");
  setTimeout(() => {
    opened = true; shownDate = shownDate || today();
    $("front").style.display = "none"; $("letter").style.display = "block";
    render();
    if (write) startWriting(shownDate);
  }, 700);
}
$("envelope").onclick = () => openEnvelope(false);
$("quickBtn").onclick = () => { shownDate = today(); openEnvelope(true); };
$("closeBtn").onclick = () => {
  opened = false; $("letter").style.display = "none"; $("front").style.display = "block";
  $("envelope").classList.remove("open"); $("writeArea").style.display = "none";
};

/* ---------- render ---------- */
function render() {
  const saved = slug(store("diaryName") || "");
  if (opened) {
    const d = shownDate || today();
    $("date").textContent = fmt(d);
    const box = $("notes"); box.innerHTML = "";
    const day = letters.filter(l => l.date === d).sort((a, b) => a.updatedAt - b.updatedAt);
    if (!day.length) box.appendChild(el("div", "empty", "A blank page. Maybe you’d like to write the first little story?"));
    day.forEach(l => {
      const n = el("div", "note"), who = el("div", "who");
      const isMe = saved && l.author === saved;
      who.appendChild(el("span", "", (l.name || "Someone") + (isMe ? " (you)" : "")));
      if (isMe) { const a = el("a", "", "edit"); a.onclick = () => startWriting(d); who.appendChild(a); }
      n.appendChild(who); n.appendChild(el("div", "story", l.text)); box.appendChild(n);
    });
  }
  const list = $("archiveList"); list.innerHTML = "";
  const dates = [...new Set(letters.map(l => l.date))].sort().reverse();
  if (!dates.length) list.appendChild(el("div", "empty", "No letters yet."));
  dates.forEach(d => {
    const day = letters.filter(l => l.date === d), it = el("div", "item");
    it.appendChild(el("strong", "", fmt(d)));
    it.appendChild(el("div", "", day.map(l => l.name || "Someone").join(" & ") + " — " + day[0].text.slice(0, 70) + (day[0].text.length > 70 ? "..." : "")));
    it.onclick = () => { shownDate = d; opened = true; location.hash = ""; $("front").style.display = "none"; $("letter").style.display = "block"; $("writeArea").style.display = "none"; route(); };
    list.appendChild(it);
  });
}

/* ---------- write ---------- */
function startWriting(date) {
  $("writeArea").style.display = "block";
  $("entryDate").value = date;
  $("myName").value = store("diaryName") || "";
  $("entryText").value = mine(date) ? mine(date).text : "";
  $("entryText").focus();
}
$("writeBtn").onclick = () => { const a = $("writeArea"); a.style.display === "block" ? a.style.display = "none" : startWriting(shownDate || today()); };
$("entryDate").onchange = () => { const d = $("entryDate").value; $("entryText").value = mine(d) ? mine(d).text : ""; };
$("myName").oninput = () => { const d = $("entryDate").value; if (mine(d)) $("entryText").value = mine(d).text; };

$("saveBtn").onclick = async () => {
  const date = $("entryDate").value, text = $("entryText").value.trim(), name = $("myName").value.trim();
  if (!db) return alert("Not connected yet. Check your Firebase settings.");
  if (!name) return alert("Add your name first 🙂");
  if (!date || !text) return alert("Write something first 🙂");
  store("diaryName", name);
  const author = slug(name);
  try {
    await db.collection("letters").doc(date + "_" + author).set({ date, text, name, author, updatedAt: Date.now() });
    shownDate = date; $("writeArea").style.display = "none"; render();
  } catch (e) {
    alert("Couldn’t save: " + (e.code || e.message));
  }
};

/* ---------- connect ---------- */
try {
  if (firebaseConfig.apiKey === "PASTE_HERE") throw new Error("no config");
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.collection("letters").orderBy("date", "desc").limit(500).onSnapshot(
    snap => { letters = snap.docs.map(d => d.data()); $("status").textContent = "live ♡ — new letters appear here by themselves"; route(); },
    e => { $("status").textContent = "Couldn’t load letters (" + (e.code || e.message) + ")."; }
  );
} catch (e) {
  $("status").textContent = "Paste your Firebase settings at the top of the script to turn on saving.";
}
</script>
</body>
</html>
